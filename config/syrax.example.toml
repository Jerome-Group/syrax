# Public example only. This file is a configuration contract, not a live deployment file.
# Keep secrets in the runtime environment or a private secret store.

[runtime]
# The adapter is OpenClaw, pinned to an exact version by `runtime/package-lock.json` and installed
# outside the checkout (ADR-0003). The entrypoint is that install's own, never a global one.
adapter = "openclaw"
entrypoint = "<runtime root>/node_modules/openclaw/openclaw.mjs"
# What one machine supplies. `config/deployment.example.json` is its public shape; the live copy
# lives outside the repository with the roots it names, and generates the file below.
deployment = "/absolute/path/outside/this/repository/deployment.json"
generated_config = "/absolute/path/outside/this/repository/openclaw.json"

[model]
# Names only, and the chains themselves are `src/adapter/front-lane.ts` rather than this file:
# a rung is a provider and a model together, ordered, which a single pair cannot say (ADR-0016).
provider = "syrax-gemini"
name = "gemini-3.5-flash-lite"

[paths]
# Keep these roots outside the Syrax repository.
private_state = "/absolute/path/outside/this/repository/syrax-state"
chat_archive = "/absolute/path/outside/this/repository/chat-archive"
# The search index is derived verbatim from private document contents. It is private runtime
# state, and placement outside the checkout is what keeps it out — not an ignore rule.
search_index = "/absolute/path/outside/this/repository/search-index"
benchmark = "/absolute/path/outside/this/repository/benchmark"
# Gateway logs carry chat content, so they are private runtime state like the rest of these roots.
# Rotate them: a supervisor's append-only redirection grows without bound.
logs = "/absolute/path/outside/this/repository/logs"
# The usage report is written here as well as posted in chat, so that an agent working in the
# checkout can read it. It holds provider telemetry, which is private runtime state.
usage_report = "/absolute/path/outside/this/repository/usage-report"

[search]
# Pinned by measurement in ADR-0004, not by preference. The quantisation is part of the pin:
# the int8 export of the same model holds twice the memory at two thirds of the speed.
embedder = "onnx-community/embeddinggemma-300m-ONNX"
embedder_variant = "model_q4"
# `confident` sends a file without asking, so this is set for precision and not for coverage.
# Provisional: fitted to a fifteen-query benchmark, and revisited as that benchmark grows.
confident_floor = 0.12
# Below this, the answer is "nothing here" rather than a shortlist of the least-bad matches.
empty_floor = -0.23
# The model is held while search is in use and dropped after this long idle, rather than
# sitting in memory around the clock. The first search after a gap pays the model load.
idle_evict_after = "30m"

[security]
# One JSON store, reached by file-backed SecretRefs, and refused rather than used when the machine
# has left it readable (ADR-0010). Nothing resolved is written down: the runtime's generated
# `models.json` carries the credential marker `secretref-managed` and no key.
secrets_from = "one-json-store-by-file-backed-ref"
secrets_store = "/absolute/path/outside/this/repository/secrets/syrax.json"
tool_policy = "explicit-allowlist"

[observability]
# Logs must not contain secrets, private chats, or provider responses by default.
log_policy = "sanitised-and-local"
